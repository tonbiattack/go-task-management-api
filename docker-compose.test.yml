version: '3.8'

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./test-results:/app/test-results
      - ./test-logs:/app/test-logs
      - ./coverage-reports:/app/coverage-reports
    environment:
      - GO111MODULE=on
      - CGO_ENABLED=0
      - GOOS=linux
    command: /app/run-tests.sh